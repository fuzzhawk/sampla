name: build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 wine64

      - name: Build plugin (x64 + x86)
        run: make

      - name: Build test host
        run: make test

      - name: Smoke test under Wine (x64)
        run: |
          export WINEDEBUG=-all
          wine build/host64.exe build/GranularSampler_x64.dll

      - name: Upload DLLs
        uses: actions/upload-artifact@v4
        with:
          name: GranularSampler-dlls
          path: build/*.dll

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.dll
